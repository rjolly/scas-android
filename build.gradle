plugins {
    id('com.android.application') version '8.13.2'
}

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId 'scas.editor.android'
        namespace 'scas.editor.android'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 69
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += "**/*.tasty"
        }
    }
}

dependencies {
    implementation 'org.beanshell:bsh:2.0b5'
    implementation 'net.sourceforge.jscl-meditor:txt2xhtml:4.1'
    implementation 'net.sourceforge.jscl-meditor:rendering:1.1'
    implementation 'org.scala-lang:scala3-library_3:3.9.0'
    implementation 'org.scala-lang.modules:scala-parser-combinators_3:2.4.0'
    implementation 'org.scala-lang.modules:scala-parallel-collections_3:1.2.0'
    implementation files('libs/scas.application_3-3.1.jar')
    implementation files('libs/scas_3-3.1.jar')
    implementation files('libs/jscl.jar')
    implementation files('libs/meditor.jar')
    implementation files('libs/scripting.jar')
}
